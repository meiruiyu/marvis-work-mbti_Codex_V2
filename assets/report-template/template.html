<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TYPE}}｜{{NAME}}</title>
  <style>:root{--bg:{{BG}};--accent:{{ACCENT}};--ink:{{TEXT}}}{{STYLE}}h1{line-height:1.12;padding-bottom:2px}</style>
</head>
<body>
  <main class="poster">
    <header class="hero">
      <div class="hero-copy">
        <div class="eyebrow">YOUR MARVIS WORK MBTI</div>
        <div class="camp">{{CAMP}}</div>
        <h1><span>{{TYPE}}</span><b>{{NAME}}</b></h1>
        <p class="tagline">{{TAGLINE}}</p>
      </div>
      <div class="personality-visual"><img src="{{PERSONALITY_IMAGE}}" alt="{{TYPE}} {{NAME}}人格形象"></div>
    </header>
    <section class="evidence">
      <div class="section-label">电脑出卖了你</div>
      {{EVIDENCE}}
    </section>
    <section class="axes">
      <div class="section-label">四维工作人格</div>
      {{AXES}}
    </section>
    <footer>
      <div class="footer-copy"><strong>{{TAG}}</strong><span>{{PRIVACY}}</span></div>
      <div class="mark">MARVIS<br>WORK CLONE</div>
    </footer>
  </main>
  <style>
    .hero{display:grid;grid-template-columns:minmax(0,1fr) 248px;gap:28px;align-items:start}
    .hero-copy{min-width:0}
    .hero h1{font-size:54px;line-height:1.02}
    .hero h1 b{display:block;font-size:42px;line-height:1.12;margin-top:9px}
    .personality-visual{width:248px;height:248px;background:#fff;border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);overflow:hidden}
    .personality-visual img{display:block;width:100%;height:100%;object-fit:cover}
    footer{grid-template-columns:1fr 110px}
    @media(max-width:940px){.hero{grid-template-columns:minmax(0,1fr) 27.5vw;gap:3vw}.personality-visual{width:27.5vw;height:27.5vw}.hero h1{font-size:5.7vw}.hero h1 b{font-size:4.5vw}}
  </style>
</body>
</html>
